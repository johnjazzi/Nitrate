{
  "name": "Read existing PR74 Cloud failure evidence",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "pr74-read-only-cloud-evidence",
    "cancel-in-progress": false
  },
  "jobs": {
    "evidence": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Checkout diagnostic branch",
          "uses": "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Install pinned authentication dependencies",
          "run": "python3 -m venv \"$RUNNER_TEMP/evidence-venv\"\n\"$RUNNER_TEMP/evidence-venv/bin/pip\" install --disable-pip-version-check --require-hashes -r scripts/cloud-monitor-requirements.txt"
        },
        {
          "name": "Retrieve existing failed build artifacts (GET only)",
          "env": {
            "APP_STORE_CONNECT_KEY_ID": "${{ secrets.APP_STORE_CONNECT_KEY_ID }}",
            "APP_STORE_CONNECT_ISSUER_ID": "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}",
            "APP_STORE_CONNECT_PRIVATE_KEY": "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}"
          },
          "run": "\"$RUNNER_TEMP/evidence-venv/bin/python\" scripts/pr74_cloud_evidence.py"
        },
        {
          "name": "Retain failure evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "pr74-cloud-failure-evidence",
            "path": "cloud-failure-evidence/",
            "retention-days": 2,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
