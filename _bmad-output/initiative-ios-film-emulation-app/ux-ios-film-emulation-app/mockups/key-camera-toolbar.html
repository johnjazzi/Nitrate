<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera — Toolbar Open</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: -apple-system, 'SF Pro', system-ui, sans-serif; }
  .phone { width: 393px; height: 852px; background: #000; border-radius: 44px; overflow: hidden; position: relative; box-shadow: 0 0 0 3px #333, 0 20px 60px rgba(0,0,0,0.5); }
  .preview { position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 40%, rgba(60,80,120,.22) 0%, transparent 60%), radial-gradient(ellipse at 70% 60%, rgba(40,50,70,.12) 0%, transparent 50%), linear-gradient(180deg, #1a1a2e 0%, #16213e 30%, #0f3460 60%, #1a1a1a 100%); }

  /* Status */
  .status { position: absolute; top: 16px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 32px; color: #fff; font-size: 13px; font-weight: 500; opacity: 0.5; z-index: 2; }

  /* Toolbar — floating panel below status */
  .toolbar {
    position: absolute; top: 42px; left: 8px; right: 8px;
    height: 44px; padding: 0 6px;
    background: rgba(0,0,0,.55); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius: 14px; border: 1px solid rgba(255,255,255,.08);
    display: flex; align-items: center; gap: 2px; z-index: 3;
  }
  .tb-item {
    height: 32px; padding: 0 8px; border-radius: 8px;
    font-size: 11px; font-weight: 500; color: rgba(255,255,255,.6);
    display: flex; align-items: center; gap: 3px; cursor: pointer;
    white-space: nowrap;
  }
  .tb-item.active { background: rgba(255,255,255,.15); color: #fff; }
  .tb-spacer { flex: 1; }

  .ev-group { display: flex; align-items: center; gap: 4px; }
  .ev-val { color: #fff; font-size: 11px; font-weight: 600; font-family: 'SF Mono', monospace; width: 30px; text-align: center; }
  .ev-track { width: 70px; height: 3px; background: rgba(255,255,255,.15); border-radius: 2px; position: relative; }
  .ev-fill { position: absolute; left: 0; top: 0; width: 57%; height: 100%; background: rgba(255,255,255,.7); border-radius: 2px; }
  .ev-thumb { position: absolute; left: 55%; top: -6px; width: 15px; height: 15px; border-radius: 50%; background: #fff; }

  /* Stock pill — active with subtle border */
  .stock {
    position: absolute; top: 98px; left: 50%; transform: translateX(-50%);
    height: 36px; padding: 0 14px;
    background: rgba(0,0,0,.45); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius: 9999px;
    display: flex; align-items: center; gap: 6px;
    color: #fff; font-size: 14px; font-weight: 500;
    z-index: 2; border: 1px solid rgba(255,255,255,.25);
  }
  .stock .chevron { opacity: 0.35; font-size: 10px; }
  .stock .name { min-width: 42px; text-align: center; }

  .shutter-outer { position: absolute; bottom: 48px; left: 50%; transform: translateX(-50%); width: 74px; height: 74px; border-radius: 50%; border: 4px solid #fff; display: flex; align-items: center; justify-content: center; z-index: 2; }
  .shutter-inner { width: 62px; height: 62px; border-radius: 50%; background: rgba(255,255,255,.15); }
  .label { position: absolute; bottom: 140px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.5); color: rgba(255,255,255,.5); font-size: 10px; padding: 4px 10px; border-radius: 8px; text-transform: uppercase; letter-spacing: 1px; z-index: 10; }
</style>
</head>
<body>
<div class="phone">
  <div class="preview"></div>
  <div class="status"><span>9:41</span><span style="opacity:.3">●●●●○ ▹</span></div>

  <div class="toolbar">
    <div class="tb-item active">13mm</div>
    <div class="tb-item">24mm</div>
    <div class="tb-item">Tele</div>
    <div class="tb-item">↻</div>
    <div class="tb-item">⚡</div>
    <div class="tb-item">◐</div>
    <div class="ev-group">
      <span class="ev-val">+0.3</span>
      <div class="ev-track"><div class="ev-fill"></div><div class="ev-thumb"></div></div>
    </div>
    <div class="tb-spacer"></div>
    <div class="tb-item" style="font-size:14px">⚙</div>
  </div>

  <div class="stock">
    <span class="chevron">◂</span><span class="name">500T</span><span class="chevron">▸</span>
  </div>

  <div class="shutter-outer"><div class="shutter-inner"></div></div>
  <div class="label">Toolbar Open</div>
</div>
</body>
</html>
