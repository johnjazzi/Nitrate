<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera — Readouts + Locked</title>
<style>
  /* Governed by: DESIGN.md (Colors — accent-locked, Components — Readouts, Typography)
     EXPERIENCE.md (State Patterns — Idle with readouts, Component Patterns — Exposure Controls, Interaction Primitives — Tap lock) */

  :root {
    --bg: #000000;
    --surface: rgba(26,26,26,0.85);
    --text-primary: #FFFFFF;
    --text-secondary: rgba(255,255,255,0.6);
    --accent-locked: #2563EB;
    --accent: #3B82F6;
    --record: #FF3B30;
    --safe-top: 54px;
    --safe-bottom: 34px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, 'SF Pro', system-ui, sans-serif;
  }

  .phone {
    width: 393px; height: 852px;
    background: var(--bg);
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 0 3px #333, 0 20px 60px rgba(0,0,0,0.5);
  }

  .preview {
    position: absolute; inset: 0;
    background: 
      radial-gradient(ellipse at 30% 40%, rgba(60,80,120,0.3) 0%, transparent 60%),
      radial-gradient(ellipse at 70% 60%, rgba(40,50,70,0.2) 0%, transparent 50%),
      linear-gradient(180deg, #1a1a2e 0%, #16213e 30%, #0f3460 60%, #1a1a1a 100%);
  }

  .status-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: var(--safe-top);
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 14px 28px 8px;
    color: var(--text-primary);
    font-size: 14px;
    font-weight: 500;
  }

  /* Readouts container — top-left */
  .readouts {
    position: absolute;
    top: calc(var(--safe-top) + 8px);
    left: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .readout {
    height: 28px;
    padding: 0 10px;
    background: var(--surface);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 17px;
    font-weight: 600;
    font-family: 'SF Mono', monospace;
    cursor: pointer;
    min-width: 72px;
  }
  .readout.locked {
    background: rgba(37,99,235,0.2);
    color: var(--accent-locked);
    box-shadow: inset 0 0 0 1px rgba(37,99,235,0.3);
  }
  .readout.unlocked {
    color: var(--text-primary);
  }
  .readout-label {
    font-size: 10px;
    font-weight: 500;
    font-family: -apple-system, 'SF Pro', system-ui, sans-serif;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-right: 2px;
  }

  /* Stock Strip */
  .stock-strip {
    position: absolute;
    bottom: calc(var(--safe-bottom) + 100px);
    left: 50%;
    transform: translateX(-50%);
    height: 44px;
    padding: 0 20px;
    background: var(--surface);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 9999px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .stock-strip .chevron { color: var(--text-secondary); font-size: 12px; }
  .stock-strip .stock-name { color: var(--text-primary); font-size: 15px; font-weight: 400; min-width: 48px; text-align: center; }

  /* Record Button */
  .record-btn-outer {
    position: absolute;
    bottom: calc(var(--safe-bottom) + 24px);
    left: 50%;
    transform: translateX(-50%);
    width: 80px; height: 80px;
    border-radius: 50%;
    border: 4px solid var(--record);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .record-btn-inner {
    width: 68px; height: 68px;
    border-radius: 50%;
    background: rgba(26,26,26,0.6);
  }

  /* EV indicator when manual */
  .ev-indicator {
    position: absolute;
    top: calc(var(--safe-top) + 80px);
    left: 16px;
    height: 24px;
    padding: 0 8px;
    background: var(--surface);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 8px;
    display: flex;
    align-items: center;
    font-size: 13px;
    font-weight: 500;
    font-family: 'SF Mono', monospace;
    color: var(--text-secondary);
  }

  .screen-label {
    position: absolute;
    top: 130px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6);
    color: var(--text-secondary);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="preview"></div>
  <div class="screen-label">Readouts + Locked</div>

  <div class="status-bar">
    <span style="font-weight:600">9:41</span>
    <span style="display:flex;gap:6px;opacity:0.8">●●●●○ ▹</span>
  </div>

  <!-- Readouts: shutter locked (blue), ISO unlocked (auto) -->
  <div class="readouts">
    <div class="readout locked">
      <span class="readout-label">S</span>
      <span>1/48</span>
    </div>
    <div class="readout unlocked">
      <span class="readout-label">ISO</span>
      <span>640</span>
    </div>
  </div>

  <!-- EV indicator -->
  <div class="ev-indicator">EV +0.3</div>

  <div class="stock-strip">
    <span class="chevron">◂</span>
    <span class="stock-name">500T</span>
    <span class="chevron">▸</span>
  </div>

  <div class="record-btn-outer">
    <div class="record-btn-inner"></div>
  </div>
</div>
</body>
</html>
