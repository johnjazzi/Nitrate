name: Nitrate
options:
  bundleIdPrefix: com.nitrate
  deploymentTarget:
    iOS: "27.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: "YES"
    # Single source of truth for the version shown on the splash and in
    # CFBundleShortVersionString / CFBundleVersion. Bump MARKETING_VERSION for a
    # user-visible release, CURRENT_PROJECT_VERSION for every build.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_KEY_CFBundleDisplayName: Nitrate
    INFOPLIST_KEY_NSCameraUsageDescription: "Nitrate needs camera access to capture Apple Log video for film stock processing."
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "Nitrate records audio to accompany your film clips."
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Nitrate saves rendered videos and optional original Log recordings to your photo library."
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Nitrate saves rendered videos and optional original Log recordings to your photo library."
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_UIRequiredDeviceCapabilities: "metal video-capture"
    INFOPLIST_KEY_UIStatusBarHidden: "YES"
    DEVELOPMENT_TEAM: "U43C6BCZFS"

configs:
  Debug: debug
  Release: release

schemes:
  Nitrate:
    build:
      targets:
        Nitrate: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
  RenderCLI:
    build:
      targets:
        RenderCLI: all
    test:
      targets:
        - RenderCLITests

  CameraDesign:
    build:
      targets:
        CameraDesignTests: all
    test:
      targets:
        - CameraDesignTests

targets:
  CameraDesignTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/CameraDesignTests.swift
      - path: Tests/CameraDesignRenderTests.swift
      - path: Tests/ManualControlsOverlayTests.swift
      - path: Tests/CameraZoomPolicyTests.swift
      - path: App/Modules/CameraCapture/CameraZoomPolicy.swift
      - path: App/Modules/ProcessingPipeline/GrainModel.swift
      - path: App/Modules/CameraCapture/FramedPreviewLayout.swift
      - path: Tests/CameraCleanupPresentationTests.swift
      - path: App/Modules/CameraCapture/RecordingTimerBadge.swift
      - path: App/Modules/CameraCapture/ManualControlsOverlay.swift
      - path: App/Modules/CameraCapture/ManualControlsSurface.swift
      - path: App/Modules/CameraCapture/CameraStabilizationPolicy.swift
      - path: App/Modules/CameraCapture/RecordButtonPresentation.swift
      - path: App/Modules/CameraCapture/RecordingStatusFace.swift
      - path: App/Modules/CameraCapture/CameraTopPanelLayout.swift
      - path: App/Modules/CameraCapture/CameraDesignFaces.swift
      - path: App/Modules/CameraCapture/CameraShootingLayout.swift
      - path: App/Modules/CameraCapture/CameraLensFace.swift
      - path: App/Modules/CameraCapture/CameraRaisedButtonStyle.swift
      - path: App/Modules/CameraCapture/RecordingTimeLCD.swift
      - path: App/Modules/CameraCapture/CameraStatusPresentation.swift
    settings:
      SWIFT_VERSION: "6.0"

  Nitrate:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Resources/Preview
      - path: App/Resources/Preview
        type: folder
        buildPhase: resources
      - path: Resources/Shaders
        type: metal
    resources:
      - path: App/Resources/LUTs
        type: folder
      - path: App/Resources/Grain
        type: folder
      - path: App/Resources/stocks.json
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        # Deliberately unchanged by the Nitrate rename: the App Store identifier
        # and the com.filmemulation.* movie metadata keys are already shipped.
        PRODUCT_BUNDLE_IDENTIFIER: com.filmemulation.app
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "U43C6BCZFS"
        CODE_SIGN_IDENTITY: "Apple Development"
        PROVISIONING_PROFILE_SPECIFIER: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: SwiftLint
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          python3 "$SRCROOT/scripts/verify.py" lint
        basedOnDependencyAnalysis: false

  RenderCLI:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: CLI/
      - path: App/Modules/ProcessingPipeline/
      - path: App/Modules/FilmStockLibrary/
      - path: Resources/Shaders/
        type: metal
      - path: Resources/Grain/grain3d.raw
        type: file
      - path: Resources/LUTs/
        type: file
      - path: Resources/stocks.json
    dependencies:
      - sdk: Metal.framework
      - sdk: AVFoundation.framework
    settings:
      SWIFT_VERSION: "6.0"

  RenderCLITests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
      - path: App/AppIdentity.swift
      - path: App/SplashEdgeDetails.swift
      - path: App/SplashEdgeOverlay.swift
      - path: App/StartupSplashTiming.swift
      - path: App/Modules/ProcessingPipeline/
      - path: App/Modules/FilmStockLibrary/
      - path: App/Modules/RenderQueue/RenderJob.swift
      - path: App/Modules/RenderQueue/QueuePersister.swift
      - path: App/Modules/RenderQueue/RenderQueueViewModel.swift
      - path: App/Modules/CameraCapture/CameraOriginalStorage.swift
      - path: App/Modules/CameraCapture/CameraPreviewPolicy.swift
      - path: App/Modules/CameraCapture/CameraPreviewTap.swift
      - path: App/Modules/CameraCapture/CameraPolicies.swift
      - path: App/Modules/CameraCapture/CameraZoomPolicy.swift
      - path: App/Modules/CameraCapture/CameraStabilizationPolicy.swift
      - path: App/Modules/CameraCapture/CameraStatusPresentation.swift
      - path: App/Modules/CameraCapture/FramedPreviewLayout.swift
      - path: App/Modules/CameraCapture/ManualControlsOverlay.swift
      - path: App/Modules/CameraCapture/ManualControlsSurface.swift
      - path: App/Modules/CameraCapture/RulerScale.swift
      - path: App/Modules/CameraCapture/CameraSampleBufferRecorder.swift
      - path: App/Modules/CameraCapture/CameraCapturePreservationProbe.swift
      - path: App/Modules/CameraCapture/RecordButtonPresentation.swift
      - path: App/Modules/CameraCapture/RecordingDurationText.swift
      - path: App/Modules/CameraCapture/RecordingTimerBadge.swift
      - path: App/Modules/CameraCapture/RecordingStatusFace.swift
      - path: App/Modules/CameraCapture/CameraTopPanelLayout.swift
      - path: App/Modules/CameraCapture/CameraDesignFaces.swift
      - path: App/Modules/CameraCapture/CameraShootingLayout.swift
      - path: App/Modules/CameraCapture/CameraLensFace.swift
      - path: App/Modules/CameraCapture/CameraRaisedButtonStyle.swift
      - path: App/Modules/CameraCapture/RecordingTimeLCD.swift
      - path: App/Modules/CameraCapture/RecordingFeedbackPolicy.swift
      - path: Resources/Shaders/
        type: metal
      - path: Resources/Grain
        type: folder
        buildPhase: resources
      - path: App/Resources/LUTs
        type: folder
        buildPhase: resources
      - path: Resources/stocks.json
        buildPhase: resources
    dependencies:
      - sdk: Metal.framework
      - sdk: AVFoundation.framework
      - sdk: Photos.framework
      - sdk: ImageIO.framework
    settings:
      SWIFT_VERSION: "6.0"
