name: Nitrate
options:
  bundleIdPrefix: com.nitrate
  deploymentTarget:
    iOS: "27.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  # Reference every source by its full path from the project root, so a file
  # reached through a target's directory source and the same file listed
  # explicitly by another target resolve to one group instead of two. Without
  # this XcodeGen reports the ProcessingPipeline/CameraCapture references as
  # members of multiple groups and the project is malformed.
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: "YES"
    # Single source of truth for the version shown on the splash and in
    # CFBundleShortVersionString / CFBundleVersion. Bump MARKETING_VERSION for a
    # user-visible release, CURRENT_PROJECT_VERSION for every build.
    MARKETING_VERSION: "0.4.3"
    CURRENT_PROJECT_VERSION: "15"
    INFOPLIST_KEY_CFBundleDisplayName: Nitrate
    INFOPLIST_KEY_NSCameraUsageDescription: "Nitrate needs camera access to capture Apple Log video for film stock processing."
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "Nitrate records audio to accompany your film clips."
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Nitrate saves rendered videos and optional original Log recordings to your photo library."
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_UIRequiredDeviceCapabilities: "metal video-camera"
    INFOPLIST_KEY_UIStatusBarHidden: "YES"
    # Only Apple-provided services and SHA-256 diagnostic hashing; matches
    # the reviewed App Store Connect export-compliance answer.
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
    DEVELOPMENT_TEAM: "U43C6BCZFS"

configs:
  Debug: debug
  DevRelease: release
  Release: release

schemes:
  Nitrate:
    build:
      targets:
        Nitrate: all
    run:
      config: Debug
      # Kept for local StoreKit runs, but the gated paywall is only reachable
      # through the dedicated NitrateStoreKitTest scheme, which also passes the
      # opt-in launch argument. A normal run stays unrestricted. Kept outside
      # App/ so the fixture is never compiled into or bundled with the app.
      storeKitConfiguration: StoreKit/Nitrate.storekit
    profile:
      config: Release
    archive:
      config: Release
  NitrateDev:
    build:
      targets:
        Nitrate: all
    run:
      config: Debug
      storeKitConfiguration: StoreKit/Nitrate.storekit
    profile:
      config: DevRelease
    archive:
      config: DevRelease
  # Debug-only paywall harness. The launch argument makes StoreManager skip the
  # free debug unlock and evaluate StoreKit against the local configuration file,
  # so the gated paywall (evaluation, purchase, restore, expiry, refund) can be
  # exercised before any product exists in App Store Connect. Normal development
  # (Nitrate/NitrateDev) never passes the argument, and Release never honours it.
  NitrateStoreKitTest:
    build:
      targets:
        Nitrate: all
    run:
      config: Debug
      commandLineArguments:
        "-NitrateStoreKitTesting": true
      storeKitConfiguration: StoreKit/Nitrate.storekit
    profile:
      config: Debug
    archive:
      config: Debug
  RenderCLI:
    build:
      targets:
        RenderCLI: all
    test:
      targets:
        - RenderCLITests

  CameraInteraction:
    build:
      targets:
        Nitrate: all
        CameraInteractionUITests: all
    test:
      targets:
        - CameraInteractionUITests
  CameraDesign:
    build:
      targets:
        CameraDesignTests: all
    test:
      targets:
        - CameraDesignTests

targets:
  CameraInteractionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Nitrate
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nitrate.app.dev.interaction-tests
      TEST_TARGET_NAME: Nitrate
  CameraDesignTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/CameraDesignTests.swift
      - path: Tests/RecordButtonAppearanceTests.swift
      - path: Tests/RecordButtonAppearanceRenderTests.swift
      - path: Tests/CameraFrameControlAlignmentTests.swift
      - path: Tests/DaylightExposureRescueTests.swift
      - path: App/Modules/CameraCapture/ExposureRescueControl.swift
      - path: Tests/CameraDesignRenderTests.swift
      - path: Tests/ManualControlsOverlayTests.swift
      - path: Tests/CameraZoomPolicyTests.swift
      - path: Tests/CameraFocalZoomPolicyTests.swift
      - path: Tests/CameraMoodControlsTests.swift
      - path: Tests/CameraMoodLayoutTests.swift
      - path: Tests/CameraMoodRenderTests.swift
      - path: Tests/LiveRecordingStatusTests.swift
      - path: Tests/CameraTopPanelVisibilityTests.swift
      - path: Tests/CameraFloatingChromeTests.swift
      - path: Tests/FocalLengthRulerTests.swift
      - path: Tests/ManualFocusRulerTests.swift
      - path: Tests/FrameRulerPlacementTests.swift
      - path: Tests/MeteringIndicatorTests.swift
      - path: Tests/InlineManualControlsTests.swift
      - path: Tests/ManualControlsFeatureFlagTests.swift
      - path: Tests/FramedPreviewLayoutTests.swift
      - path: Tests/TestRepository.swift
      - path: App/Modules/CameraCapture/CameraZoomPolicy.swift
      - path: App/Modules/CameraCapture/CameraFocalZoomPolicy.swift
      - path: App/Modules/ProcessingPipeline/GrainModel.swift
      - path: App/Modules/CameraCapture/FramedPreviewLayout.swift
      - path: Tests/CameraCleanupPresentationTests.swift
      - path: App/Modules/CameraCapture/RecordingTimerBadge.swift
      - path: App/Modules/CameraCapture/ManualControlsOverlay.swift
      - path: App/Modules/CameraCapture/ManualControlsSurface.swift
      - path: App/Modules/CameraCapture/CameraStabilizationPolicy.swift
      - path: App/Modules/CameraCapture/RecordButtonPresentation.swift
      - path: App/Modules/CameraCapture/RecordButtonAppearance.swift
      - path: App/Modules/CameraCapture/ModernRecordButtonFace.swift
      - path: App/Modules/CameraCapture/RecordingStatusFace.swift
      - path: App/Modules/CameraCapture/CameraTopPanelLayout.swift
      - path: App/Modules/CameraCapture/CameraDesignFaces.swift
      - path: App/Modules/CameraCapture/CameraShootingLayout.swift
      - path: App/Modules/CameraCapture/CameraLensFace.swift
      - path: App/Modules/CameraCapture/CameraRaisedButtonStyle.swift
      - path: App/Design/NitrateTypography.swift
      - path: App/Resources/Fonts
        type: folder
        buildPhase: resources
      - path: App/Modules/Purchase/SettingsSelectionRow.swift
      - path: App/Modules/CameraCapture/RecordingTimeLCD.swift
      - path: App/Modules/CameraCapture/RecordingTallyLight.swift
      - path: App/Modules/CameraCapture/FocalLengthRuler.swift
      - path: App/Modules/CameraCapture/ManualFocusRuler.swift
      - path: App/Modules/CameraCapture/FrameRulerPlacement.swift
      - path: App/Modules/CameraCapture/FrameZoomRuler.swift
      - path: App/Modules/CameraCapture/InlineManualControls.swift
      - path: App/Modules/CameraCapture/CameraManualControlsFeatureFlags.swift
      - path: App/Modules/CameraCapture/MeteringBoxView.swift
      - path: App/Modules/CameraCapture/CameraStatusPresentation.swift
    settings:
      SWIFT_VERSION: "6.0"
      # The fixture-packaging build phase reads the checkout and writes into the
      # built test bundle; script sandboxing would deny the source reads.
      ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    postBuildScripts:
      # Snapshot the allowlisted repository fixtures into the test bundle so the
      # source-contract suites run where no checkout exists (Apple Cloud Test).
      - name: Package test fixtures
        script: |
          python3 "$SRCROOT/scripts/package_test_fixtures.py" \
            --repo-root "$SRCROOT" \
            --output "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/test-repository"
        basedOnDependencyAnalysis: false

  Nitrate:
    info:
      path: build/generated/Nitrate-Info.plist
      properties:
        UIAppFonts:
          - Fonts/Barlow-Medium.ttf
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Resources/Fonts
          - Resources/Preview
          - Resources/StockSamples
      - path: App/Resources/StockSamples
        type: folder
        buildPhase: resources
      - path: App/Resources/Fonts
        type: folder
        buildPhase: resources
      - path: App/Resources/Preview
        type: folder
        buildPhase: resources
      - path: Resources/Shaders
        type: metal
    resources:
      - path: App/Resources/LUTs
        type: folder
      - path: App/Resources/Grain
        type: folder
      - path: App/Resources/stocks.json
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        # Keep artifact paths stable for verification and release tooling.
        PRODUCT_NAME: Nitrate
        # The portrait-locked capture UI targets iPhone, not native iPad
        # multitasking (which requires all four interface orientations).
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "U43C6BCZFS"
        # Left as the development identity in every configuration, which is the
        # Xcode default. An archive made this way is development-signed, and the
        # App Store export re-signs it with the distribution certificate; the
        # upload therefore needs an Apple Distribution certificate to exist, but
        # nothing here needs to name it. Setting this to "Apple Distribution"
        # instead makes every Release build fail with conflicting provisioning
        # settings, and setting it empty produces an unsigned app.
        CODE_SIGN_IDENTITY: "Apple Development"
        PROVISIONING_PROFILE_SPECIFIER: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.nitrate.app.dev
          INFOPLIST_KEY_CFBundleDisplayName: Nitrate Dev
        DevRelease:
          PRODUCT_BUNDLE_IDENTIFIER: com.nitrate.app.dev
          INFOPLIST_KEY_CFBundleDisplayName: Nitrate Dev
        Release:
          # Must match the App Store Connect record (nitrate.camera) exactly.
          # Local installs never use this production identity. Preserve the
          # com.filmemulation.* movie metadata keys: they are a file contract.
          PRODUCT_BUNDLE_IDENTIFIER: com.nitrate.app
          INFOPLIST_KEY_CFBundleDisplayName: Nitrate
    preBuildScripts:
      - name: SwiftLint
        script: |
          export PATH="$SRCROOT/build/ci-tools/swiftlint-0.65.1:/opt/homebrew/bin:/usr/local/bin:$PATH"
          python3 "$SRCROOT/scripts/verify.py" lint
        basedOnDependencyAnalysis: false

  RenderCLI:
    type: tool
    platform: macOS
    # macOS 26.0 is the minimum that provides the AVFoundation receiver/provider
    # API (AVAssetReader.outputProvider(for:), AVAssetWriter.inputReceiver(for:),
    # AVAssetWriterInput.PixelBufferReceiver/SampleBufferReceiver, start()) that
    # replaces the iOS 27 / macOS 27 deprecations. See PipelineRenderer.swift.
    deploymentTarget: "26.0"
    sources:
      - path: CLI/
      - path: App/Design/NitrateTypography.swift
      - path: App/Resources/Fonts
        type: folder
        buildPhase: resources
      - path: App/Modules/ProcessingPipeline/
      - path: App/Modules/FilmStockLibrary/
      # Foundation-only hint policy, shared so its pure logic compiles and is
      # testable on macOS (the AVFoundation call site stays in the iOS session).
      - path: App/Modules/CameraCapture/StockSelectorHintPolicy.swift
      - path: App/Modules/CameraCapture/PhotoCapturePolicy.swift
      - path: App/Modules/CameraCapture/PhotoExposureSnapshot.swift
      - path: App/Modules/CameraCapture/PhotoExposureIntentPresentation.swift
      - path: App/Modules/CameraCapture/CameraShootingModeGate.swift
      - path: App/Modules/CameraCapture/CameraSessionLifecycle.swift
      - path: App/Modules/CameraCapture/PhotoExposureOperationOwnership.swift
      - path: App/Modules/CameraCapture/PhotoExposurePolicy.swift
      - path: App/Modules/CameraCapture/PhotoExposureCadence.swift
      - path: App/Modules/CameraCapture/PhotoShutterFloatPolicy.swift
      - path: App/Modules/CameraCapture/CameraVideoISORangePolicy.swift
      - path: App/Modules/CameraCapture/DevelopmentPhotoFeature.swift
      - path: App/Modules/CameraCapture/PhotoShutterPresentation.swift
      - path: App/Modules/ProcessingPipeline/PhotoColorMath.swift
      - path: App/Modules/ProcessingPipeline/PhotoZoomGeometry.swift
      - path: App/Modules/ProcessingPipeline/RAWToLog2Stage.swift
      - path: Resources/Shaders/
        type: metal
      - path: Resources/Grain/grain3d.raw
        type: file
      - path: Resources/LUTs/
        type: file
      - path: Resources/stocks.json
    dependencies:
      - sdk: Metal.framework
      - sdk: AVFoundation.framework
    settings:
      SWIFT_VERSION: "6.0"

  RenderCLITests:
    type: bundle.unit-test
    platform: macOS
